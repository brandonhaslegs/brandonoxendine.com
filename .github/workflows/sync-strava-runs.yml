name: Sync Strava runs

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build public run data
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          STRAVA_TOKEN_STORE_KEY: ${{ secrets.STRAVA_TOKEN_STORE_KEY }}
          # Optional repository variables. Defaults protect the first/last 300m and publish public activities only.
          STRAVA_ROUTE_TRIM_METERS: ${{ vars.STRAVA_ROUTE_TRIM_METERS }}
          STRAVA_INCLUDE_PRIVATE: ${{ vars.STRAVA_INCLUDE_PRIVATE }}
        run: node scripts/sync-strava-runs.mjs
      - name: Commit updated routes
        run: |
          if git diff --quiet -- runs/data; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/data
          git commit -m "Update running routes"
          git push
